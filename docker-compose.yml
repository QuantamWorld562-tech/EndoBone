version: '3.8'

services:
  # EndoBone AI Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: endobone-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:4000
      - REACT_APP_IMAGING_SERVICE=http://localhost:5000
      - REACT_APP_ENVIRONMENT=development
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - endobone-network
    restart: unless-stopped

  # Mock API Server (optional - for development)
  api:
    image: node:18-alpine
    container_name: endobone-api
    working_dir: /app
    command: npm run start:api
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
    volumes:
      - ./api:/app
    networks:
      - endobone-network
    restart: unless-stopped

  # Nginx reverse proxy (for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: endobone-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
    networks:
      - endobone-network
    restart: unless-stopped

networks:
  endobone-network:
    driver: bridge
